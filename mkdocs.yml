site_name: cip113-tx-builder
site_description: CIP-113 programmable token transaction builders for Cardano
site_url: https://lambdasistemi.github.io/cip113-tx-builder
repo_url: https://github.com/lambdasistemi/cip113-tx-builder
repo_name: lambdasistemi/cip113-tx-builder

theme:
  name: material
  palette:
    - scheme: default
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: deep purple
      accent: purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - CIP-113: cip-113.md
  - Contributing: contributing.md
