name: CI

on:
  push:
    branches: [setup, main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Build library
        run: nix build .#cip113-tx-builder --no-link --print-build-logs

      - name: Format check
        run: |
          nix develop --command bash -c "
            fourmolu --mode check src/ e2e-test/
          "

      - name: HLint
        run: |
          nix develop --command bash -c "
            hlint src/ e2e-test/
          "

      - name: Report Cabal and release-please versions
        run: |
          manifest=$(sed -n 's/.*"\."[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .release-please-manifest.json)
          read -r _ cabal <<< "$(grep '^version:' cip113-tx-builder.cabal)"
          if [ -z "$manifest" ]; then
            echo "missing release-please manifest version" >&2
            exit 1
          fi
          if [ -z "$cabal" ]; then
            echo "missing Cabal version" >&2
            exit 1
          fi
          echo "Release-please tag version: v${manifest}"
          echo "Cabal artifact version: ${cabal}"
          echo "Versions are intentionally separate for release tags vs artifact names."

      - name: E2E integration tests
        run: |
          set -euo pipefail
          e2e_tests="$(nix build .#e2e-tests --no-link --print-out-paths --print-build-logs)"
          cip113_cli="$(nix build .#cip113-cli --no-link --print-out-paths --print-build-logs)"
          cardano_node="$(nix build .#cardano-node --no-link --print-out-paths --print-build-logs)"
          util_linux="$(nix build nixpkgs#util-linux.bin --no-link --print-out-paths --print-build-logs)"
          "$util_linux/bin/script" --version >/dev/null
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cd e2e-test
          TMPDIR="$tmpdir" CIP113_CLI="$cip113_cli/bin/cip113-cli" PATH="$util_linux/bin:$cardano_node/bin:$PATH" "$e2e_tests/bin/e2e-tests"
