name: CI

on:
  push:
    branches: [setup, main, 'feat/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: [self-hosted, nixos]
    steps:
      - uses: actions/checkout@v4

      - name: Build library
        run: nix build .#cip113-tx-builder --no-link --print-build-logs

      - name: Format check
        run: |
          nix develop --command bash -c "
            fourmolu --mode check src/ e2e-test/
          "

      - name: HLint
        run: |
          nix develop --command bash -c "
            hlint src/ e2e-test/
          "

      - name: Cabal version matches manifest
        run: |
          manifest=$(sed -n 's/.*"\."[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' .release-please-manifest.json)
          pvp="${manifest}.0"
          read -r _ cabal <<< "$(grep '^version:' cip113-tx-builder.cabal)"
          if [ "$cabal" != "$pvp" ]; then
            echo "Version drift: cabal=$cabal manifest-derived=$pvp"
            exit 1
          fi
          echo "Version OK: $cabal"

      - name: E2E integration tests
        run: |
          set -euo pipefail
          e2e_tests="$(nix build .#e2e-tests --no-link --print-out-paths --print-build-logs)"
          cip113_cli="$(nix build .#cip113-cli --no-link --print-out-paths --print-build-logs)"
          cardano_node="$(nix build .#cardano-node --no-link --print-out-paths --print-build-logs)"
          util_linux="$(nix build nixpkgs#util-linux --no-link --print-out-paths --print-build-logs)"
          tmpdir="$(mktemp -d)"
          trap 'rm -rf "$tmpdir"' EXIT
          cd e2e-test
          TMPDIR="$tmpdir" CIP113_CLI="$cip113_cli/bin/cip113-cli" PATH="$util_linux/bin:$cardano_node/bin:$PATH" "$e2e_tests/bin/e2e-tests"
